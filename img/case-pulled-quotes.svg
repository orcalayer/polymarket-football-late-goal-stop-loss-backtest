<title id='t'>Case 1: a jump that was not a goal</title>
<desc id='d'>mid 30 s before 0.240; at detection mid 0.505, ask 0.78, implied bid 0.23; asks +1..+60 s: 0.81, 0.81, 0.81, 0.25, 0.25, 0.25; side won: no</desc>
