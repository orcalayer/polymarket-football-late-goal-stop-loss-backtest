<title id='t'>Case 2: a tight spread that was not a goal either</title>
<desc id='d'>mid 30 s before 0.415; at detection mid 0.705, ask 0.71, implied bid 0.70; asks +1..+60 s: 0.71, 0.71, 0.71, 0.71, 0.71, 0.71; side won: yes</desc>
